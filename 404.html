<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Page not found | Brandon Althof</title><meta name="robots" content="noindex">
<style>
@font-face{font-family:"Bitter";src:url("fonts/bitter-latin-wght-normal.woff2") format("woff2");font-weight:100 900;font-display:swap}
@font-face{font-family:"Public Sans";src:url("fonts/public-sans-latin-wght-normal.woff2") format("woff2");font-weight:100 900;font-display:swap}
:root{
  --paper:#f1f4f1;      /* siding white */
  --board:#1b2a4b;      /* bench sign navy */
  --ink:#172341;
  --lift:#f4b51b;       /* drywall lift yellow */
  --concrete:#b8bcb5;
  --grass:#5f8a3a;
  --plank:#c9a56a;
  --slab:"Bitter",Georgia,"Times New Roman",serif;
  --sans:"Public Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
}
*,*::before,*::after{box-sizing:border-box}
html{-webkit-text-size-adjust:100%;scroll-behavior:smooth}
@media (prefers-reduced-motion:reduce){html{scroll-behavior:auto}}
body{margin:0;background:var(--paper);color:var(--ink);font:400 1.0625rem/1.6 var(--sans)}
img,video{display:block;max-width:100%;height:auto}
picture{display:block}
p{margin:0 0 1em}
h1,h2,h3{font-family:var(--slab);font-weight:800;line-height:1.08;margin:0}
h2{font-size:clamp(2rem,4.6vw,3rem);letter-spacing:-.01em;margin-bottom:1.25rem}
h3{font-size:clamp(1.5rem,3vw,2rem)}
a{color:inherit;text-decoration:underline;text-decoration-color:var(--lift);text-decoration-thickness:.16em;text-underline-offset:.2em}
a:hover{background:var(--lift);color:var(--ink);text-decoration-color:var(--ink)}
a:focus-visible,video:focus-visible{outline:3px solid var(--lift);outline-offset:3px;box-shadow:0 0 0 6px var(--ink)}
.wrap{width:min(100% - 2.5rem,68rem);margin-inline:auto}
.prose{max-width:36rem}
.lead{font-family:var(--slab);font-weight:600;font-size:clamp(1.35rem,2.6vw,1.75rem);line-height:1.3}
.skip{position:absolute;left:-999rem}
.skip:focus{left:1rem;top:1rem;background:var(--lift);padding:.5rem .75rem;z-index:5}

/* nav */
.nav{display:flex;flex-wrap:wrap;gap:.35rem 1.25rem;padding-block:1.1rem;font-size:.95rem;font-weight:500}
.nav a{text-decoration-color:transparent}
.nav a:hover{text-decoration-color:var(--ink)}

/* the bench */
.bench{padding-top:clamp(.5rem,2vw,1.5rem)}
.board{background:var(--board);color:#fff;text-align:center;border-radius:3px;padding:clamp(1.75rem,5.5vw,4rem) 1rem clamp(1.5rem,4.5vw,3.25rem);box-shadow:inset 0 0 0 1px rgba(255,255,255,.14)}
.board h1{font-size:clamp(2.6rem,10.5vw,7.75rem);letter-spacing:-.015em;line-height:1}
.swoosh{display:flex;align-items:center;justify-content:center;gap:.75rem;margin:clamp(.6rem,1.8vw,1.25rem) auto;width:min(82%,36rem)}
.swoosh::before,.swoosh::after{content:"";flex:1;height:3px;background:#fff;border-radius:3px}
.swoosh::before{transform:rotate(-2deg);transform-origin:right}
.swoosh::after{transform:rotate(2deg);transform-origin:left}
.swoosh svg{flex:none;width:clamp(1.6rem,3.6vw,2.4rem);height:auto}
.place{margin:0;font-family:var(--slab);font-weight:600;font-size:clamp(1.15rem,3.4vw,2.25rem);letter-spacing:.01em}
.plank{height:clamp(8px,1.2vw,14px);background:var(--plank);margin-inline:-.4rem;border-radius:2px}
.legs{display:flex;justify-content:space-between;padding-inline:14%}
.legs i{display:block;width:clamp(1.25rem,5%,3rem);height:clamp(2rem,5.5vw,4rem);background:var(--concrete)}
.ground{height:7px;background:var(--grass);border-bottom:5px solid var(--concrete)}

/* sections */
main>section{padding-block:clamp(3rem,7vw,5.5rem)}
main>section+section.wrap{border-top:2px solid var(--ink)}
.band+section.wrap{border-top:0}

.about{display:grid;gap:clamp(1.5rem,4vw,3.5rem);align-items:start}
.portrait{max-width:22rem}
.portrait img{aspect-ratio:4/5;object-fit:cover;object-position:50% 20%}
@media (min-width:48rem){.about{grid-template-columns:22rem 1fr}}

.work{margin:0;border-top:1px solid var(--concrete)}
.work>div{display:grid;gap:.4rem 2.5rem;padding-block:1.4rem;border-bottom:1px solid var(--concrete)}
.work dt{font-family:var(--slab);font-weight:700;font-size:1.35rem;line-height:1.2}
.work dd{margin:0;max-width:36rem}
.work dd p:last-child{margin-bottom:0}
@media (min-width:48rem){.work>div{grid-template-columns:19rem 1fr}}

figure{margin:0}
figcaption{font-size:.9rem;line-height:1.4;padding-top:.55rem}

.houses-top{display:grid;gap:2rem;align-items:start}
.hammer{max-width:20rem}
@media (min-width:48rem){.houses-top{grid-template-columns:1fr 20rem;gap:3.5rem}}

.project{display:grid;gap:1.25rem;margin-top:clamp(2.5rem,6vw,4.5rem);align-items:stretch}
.post{display:none}
.project-text{max-width:30rem;align-self:end}
.project-text h3{margin-bottom:.6rem}
@media (min-width:62rem){
  .project{grid-template-columns:auto minmax(0,40rem) 1fr;gap:0 2rem}
  .post{display:block;background:#fff;border:1px solid var(--concrete);border-top:.6rem solid #fff;box-shadow:0 -1px 0 var(--concrete);padding:1.1rem .5rem;font:800 2.6rem/1 var(--slab);writing-mode:vertical-rl;text-orientation:upright;letter-spacing:-.06em;width:4.25rem;text-align:start}
}
.pair{display:grid;gap:1.75rem;margin-top:clamp(2rem,5vw,3.5rem)}
@media (min-width:48rem){.pair{grid-template-columns:1fr 1fr}}

/* Biscuit */
.band{background:var(--board);color:#fff}
.band h2{color:var(--lift)}
.dogs{display:grid;grid-template-columns:1fr 1fr;gap:1.5rem 1.1rem;margin-top:2rem}
.dogs img{aspect-ratio:5/6;object-fit:cover;width:100%}
@media (min-width:62rem){.dogs{grid-template-columns:repeat(4,1fr)}}

/* off the clock */
.clock{columns:1;column-gap:1.4rem;margin-top:2rem}
.clock figure{break-inside:avoid;margin-bottom:1.75rem}
.clock img,.clock video{width:100%}
.clock video{background:var(--board)}
@media (min-width:36rem){.clock{columns:2}}
@media (min-width:62rem){.clock{columns:3}}

/* around Erie */
.town{display:grid;gap:1.5rem 1.25rem;grid-template-columns:1fr 1fr;margin-top:2rem}
.town .wide{grid-column:1/-1}
.town .tall img{aspect-ratio:2/3;object-fit:cover;object-position:50% 12%;width:100%}
@media (min-width:48rem){
  .town{grid-template-columns:minmax(0,34rem) 1fr 1fr;grid-template-rows:auto auto}
  .town .wide{grid-column:1}
  .town .tall{grid-row:1/3}
  .town .tall:nth-of-type(3){grid-column:2}
  .town .tall:nth-of-type(4){grid-column:3}
}

.contact .phone a{white-space:nowrap}
.contact .phone{font-family:var(--slab);font-weight:800;font-size:clamp(1.7rem,6vw,3.5rem);line-height:1.15;margin:.2em 0 .6em}
.links{list-style:none;padding:0;margin:1.5rem 0 0;display:flex;flex-wrap:wrap;gap:.5rem 1.75rem;font-weight:600}

.foot{border-top:2px solid var(--ink);padding-block:1.75rem 3rem;display:flex;flex-wrap:wrap;justify-content:space-between;gap:.25rem 2rem;font-size:.95rem}
.foot p{margin:0}

</style></head><body>
<main class="wrap" style="padding-block:6rem">
<h2>That page isn't here.</h2>
<p class="lead">Biscuit may have buried it.</p>
<p><a href="/">Back to the front page</a></p>
</main></body></html>
